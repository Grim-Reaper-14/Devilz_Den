name: Windows MSVC Build

on:
  push:
    branches:
      - feature/backend-runtime-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config Debug --parallel

      - name: Verify output
        shell: pwsh
        run: |
          $dll = "build\Debug\Devilz_Den.dll"
          if (!(Test-Path $dll)) {
            throw "Expected DLL was not produced: $dll"
          }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime

      - name: Run DLL bootstrap smoke test
        shell: pwsh
        run: |
          & ".\build\Debug\Devilz_Den_Smoke_Test.exe" ".\build\Debug\Devilz_Den.dll"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload Debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Devilz_Den-Debug-windows-x64
          if-no-files-found: error
          path: |
            build/Debug/Devilz_Den.dll
            build/Debug/Devilz_Den.pdb
            build/Debug/Devilz_Den_Smoke_Test.exe
